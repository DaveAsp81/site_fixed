<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <defs>
    <radialGradient id="bg" cx="50%" cy="52%" r="78%">
      <stop offset="0%" stop-color="#231d1a"/>
      <stop offset="55%" stop-color="#121212"/>
      <stop offset="100%" stop-color="#070707"/>
    </radialGradient>

    <pattern id="hex" width="60" height="52" patternUnits="userSpaceOnUse">
      <path d="M15 0 L45 0 L60 26 L45 52 L15 52 L0 26 Z"
            fill="none" stroke="#ff8c00" stroke-width="1" opacity="0.09"/>
    </pattern>

    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d32f2f" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#d32f2f" stop-opacity="0"/>
    </radialGradient>

    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#ffffff" opacity="0.028"/>
    </pattern>

    <linearGradient id="hull" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a3a3a"/>
      <stop offset="55%" stop-color="#1c1c1c"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
    <linearGradient id="hullDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#242424"/>
      <stop offset="100%" stop-color="#070707"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#bg)"/>
  <rect width="1200" height="800" fill="url(#hex)"/>
  <ellipse cx="600" cy="470" rx="340" ry="290" fill="url(#glow)"/>

  <!-- ======================= TIMBER WOLF SILHOUETTE ======================= -->
  <g stroke="#000" stroke-width="2.5">

    <!-- ---- LEGS (reverse-jointed / digitigrade, heavy Clan build) ---- -->
    <!-- LEFT LEG -->
    <!-- hip actuator -->
    <path d="M516 440 L596 440 L592 500 L512 500 Z" fill="url(#hullDark)"/>
    <!-- thigh: down and out -->
    <path d="M508 492 L596 492 L588 590 L494 590 Z" fill="url(#hull)"/>
    <!-- knee joint (juts back/out) -->
    <path d="M486 578 L594 578 L590 622 L490 622 Z" fill="#2e2e2e"/>
    <circle cx="512" cy="600" r="16" fill="#1a1a1a" stroke="#000" stroke-width="2"/>
    <!-- shin: down and in -->
    <path d="M502 616 L590 616 L580 700 L528 700 Z" fill="url(#hullDark)"/>
    <!-- ankle -->
    <path d="M528 692 L582 692 L586 716 L524 716 Z" fill="#262626"/>
    <!-- foot -->
    <path d="M504 712 L602 712 L612 742 L494 742 Z" fill="url(#hull)"/>
    <path d="M494 736 L612 736 L612 744 L494 744 Z" fill="#0a0a0a"/>

    <!-- RIGHT LEG -->
    <path d="M604 440 L684 440 L688 500 L608 500 Z" fill="url(#hullDark)"/>
    <path d="M604 492 L692 492 L706 590 L612 590 Z" fill="url(#hull)"/>
    <path d="M606 578 L714 578 L710 622 L610 622 Z" fill="#2e2e2e"/>
    <circle cx="688" cy="600" r="16" fill="#1a1a1a" stroke="#000" stroke-width="2"/>
    <path d="M610 616 L698 616 L672 700 L620 700 Z" fill="url(#hullDark)"/>
    <path d="M618 692 L672 692 L676 716 L614 716 Z" fill="#262626"/>
    <path d="M598 712 L696 712 L706 742 L588 742 Z" fill="url(#hull)"/>
    <path d="M588 736 L706 736 L706 744 L588 744 Z" fill="#0a0a0a"/>

    <!-- ---- ARMS: side-slung laser barrels ---- -->
    <!-- left arm -->
    <path d="M432 336 L500 330 L506 400 L494 470 L440 470 L430 400 Z" fill="url(#hull)"/>
    <rect x="446" y="466" width="48" height="70" rx="5" fill="url(#hullDark)"/>
    <rect x="456" y="530" width="28" height="34" rx="3" fill="#111"/>
    <circle cx="470" cy="562" r="9" fill="#0a0a0a" stroke="#333" stroke-width="2"/>

    <!-- right arm -->
    <path d="M700 330 L768 336 L770 400 L760 470 L706 470 L694 400 Z" fill="url(#hull)"/>
    <rect x="706" y="466" width="48" height="70" rx="5" fill="url(#hullDark)"/>
    <rect x="716" y="530" width="28" height="34" rx="3" fill="#111"/>
    <circle cx="730" cy="562" r="9" fill="#0a0a0a" stroke="#333" stroke-width="2"/>

    <!-- ---- SHOULDER MISSILE PODS (the Timber Wolf signature) ---- -->
    <!-- left pod, angled up and out -->
    <path d="M424 268 L536 296 L528 356 L416 328 Z" fill="url(#hull)"/>
    <path d="M424 268 L536 296 L534 306 L422 278 Z" fill="#4a4a4a" opacity="0.5"/>
    <!-- missile tubes -->
    <g fill="#080808">
      <circle cx="446" cy="296" r="5"/><circle cx="466" cy="301" r="5"/>
      <circle cx="486" cy="306" r="5"/><circle cx="506" cy="311" r="5"/>
      <circle cx="442" cy="315" r="5"/><circle cx="462" cy="320" r="5"/>
      <circle cx="482" cy="325" r="5"/><circle cx="502" cy="330" r="5"/>
    </g>

    <!-- right pod -->
    <path d="M776 268 L784 328 L672 356 L664 296 Z" fill="url(#hull)"/>
    <path d="M776 268 L778 278 L666 306 L664 296 Z" fill="#4a4a4a" opacity="0.5"/>
    <g fill="#080808">
      <circle cx="754" cy="296" r="5"/><circle cx="734" cy="301" r="5"/>
      <circle cx="714" cy="306" r="5"/><circle cx="694" cy="311" r="5"/>
      <circle cx="758" cy="315" r="5"/><circle cx="738" cy="320" r="5"/>
      <circle cx="718" cy="325" r="5"/><circle cx="698" cy="330" r="5"/>
    </g>

    <!-- ---- CENTRE TORSO POD (wide, forward-canted) ---- -->
    <path d="M512 320 L688 320 L706 372 L686 452 L514 452 L494 372 Z" fill="url(#hull)"/>
    <!-- torso plating -->
    <path d="M528 350 L672 350" stroke="#4a4a4a" stroke-width="3" fill="none"/>
    <path d="M520 380 L680 380" stroke="#3a3a3a" stroke-width="2" fill="none"/>
    <path d="M534 412 L666 412" stroke="#2e2e2e" stroke-width="2" fill="none"/>

    <!-- ---- COCKPIT (low, centre-front) ---- -->
    <path d="M566 296 L634 296 L648 326 L634 348 L566 348 L552 326 Z" fill="url(#hullDark)"/>
  </g>

  <!-- cockpit viewport glow -->
  <path d="M572 312 L628 312 L636 330 L564 330 Z" fill="#ff8c00" opacity="0.9"/>
  <path d="M572 312 L628 312 L632 320 L568 320 Z" fill="#ffe082" opacity="0.65"/>

  <!-- ground shadow -->
  <ellipse cx="600" cy="750" rx="215" ry="16" fill="#000" opacity="0.6"/>

  <!-- ======================= TARGETING RETICLE ======================= -->
  <g stroke="#ff8c00" fill="none">
    <circle cx="600" cy="386" r="168" stroke-width="2" opacity="0.3"/>
    <circle cx="600" cy="386" r="126" stroke-width="2.5" stroke-dasharray="36 20" opacity="0.95"/>
    <!-- corner brackets -->
    <path d="M456 274 L456 242 L488 242" stroke-width="4.5"/>
    <path d="M744 274 L744 242 L712 242" stroke-width="4.5"/>
    <path d="M456 498 L456 530 L488 530" stroke-width="4.5"/>
    <path d="M744 498 L744 530 L712 530" stroke-width="4.5"/>
    <!-- crosshair ticks -->
    <path d="M600 246 L600 288" stroke-width="3"/>
    <path d="M600 484 L600 526" stroke-width="3"/>
    <path d="M462 386 L504 386" stroke-width="3"/>
    <path d="M696 386 L738 386" stroke-width="3"/>
  </g>
  <circle cx="600" cy="386" r="5.5" fill="#ff1744"/>
  <circle cx="600" cy="386" r="13" fill="none" stroke="#ff1744" stroke-width="1.5" opacity="0.6"/>

  <!-- ======================= TITLE ======================= -->
  <rect x="0" y="52" width="1200" height="128" fill="#000" opacity="0.55"/>
  <text x="600" y="146" font-family="'Rajdhani','Arial Black',sans-serif" font-size="118"
        font-weight="700" fill="#ff8c00" text-anchor="middle" letter-spacing="20">GATOR</text>
  <rect x="0" y="178" width="1200" height="32" fill="#000" opacity="0.5"/>
  <text x="600" y="200" font-family="'Share Tech Mono',monospace" font-size="18"
        fill="#c7c7c7" text-anchor="middle" letter-spacing="7">TO-HIT CALCULATION</text>

  <!-- ======================= LEFT HUD ======================= -->
  <g font-family="'Share Tech Mono',monospace">
    <rect x="52" y="330" width="248" height="248" fill="#000" opacity="0.6" rx="6"/>
    <rect x="52" y="330" width="4" height="248" fill="#d32f2f"/>

    <text x="78" y="372" font-size="20" fill="#ff8c00" font-weight="700">G</text>
    <text x="106" y="372" font-size="15" fill="#9e9e9e">GUNNERY</text>
    <text x="276" y="372" font-size="18" fill="#e8e8e8" text-anchor="end">4</text>

    <text x="78" y="418" font-size="20" fill="#ff8c00" font-weight="700">A</text>
    <text x="106" y="418" font-size="15" fill="#9e9e9e">ATTACKER MV</text>
    <text x="276" y="418" font-size="18" fill="#e8e8e8" text-anchor="end">+1</text>

    <text x="78" y="464" font-size="20" fill="#ff8c00" font-weight="700">T</text>
    <text x="106" y="464" font-size="15" fill="#9e9e9e">TARGET MV</text>
    <text x="276" y="464" font-size="18" fill="#e8e8e8" text-anchor="end">+2</text>

    <text x="78" y="510" font-size="20" fill="#ff8c00" font-weight="700">O</text>
    <text x="106" y="510" font-size="15" fill="#9e9e9e">OTHER</text>
    <text x="276" y="510" font-size="18" fill="#e8e8e8" text-anchor="end">+1</text>

    <text x="78" y="556" font-size="20" fill="#ff8c00" font-weight="700">R</text>
    <text x="106" y="556" font-size="15" fill="#9e9e9e">RANGE</text>
    <text x="276" y="556" font-size="18" fill="#e8e8e8" text-anchor="end">+2</text>
  </g>

  <!-- ======================= RIGHT HUD ======================= -->
  <g font-family="'Share Tech Mono',monospace">
    <rect x="900" y="330" width="248" height="248" fill="#000" opacity="0.6" rx="6"/>
    <rect x="1144" y="330" width="4" height="248" fill="#d32f2f"/>

    <text x="1024" y="374" font-size="14" fill="#9e9e9e" text-anchor="middle" letter-spacing="3">TARGET NUMBER</text>
    <text x="1024" y="470" font-family="'Rajdhani','Arial Black',sans-serif" font-size="96"
          font-weight="700" fill="#ffc107" text-anchor="middle">10+</text>
    <line x1="938" y1="496" x2="1110" y2="496" stroke="#3a3a3a" stroke-width="1"/>
    <text x="1024" y="528" font-size="14" fill="#9e9e9e" text-anchor="middle" letter-spacing="2">ON 2D6</text>
    <text x="1024" y="558" font-size="23" fill="#ff4c4c" text-anchor="middle" font-weight="700">17%</text>
  </g>

  <rect width="1200" height="800" fill="url(#scan)"/>
  <rect width="1200" height="800" fill="none" stroke="#000" stroke-width="64" opacity="0.38"/>
</svg>
